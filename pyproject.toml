[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["melafit"]

[project]
name = "melafit"
version = "0.1.1"
description = "High-precision circadian melatonin profile analysis"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "openpyxl",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/vitaliy-ch25/melafit"

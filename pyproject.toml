[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["melafit"]

[project]
name = "melafit"
version = "0.1.3"
description = "Python package for high-precision circadian melatonin profile analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "openpyxl",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/vitaliy-ch25/melafit"
